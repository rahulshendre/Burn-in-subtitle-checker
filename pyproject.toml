[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-checker"
version = "0.1.0"
description = "Flags mismatches between audio dialogue and burned-in subtitles in video files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "rapidfuzz>=3.0", "scipy>=1.11", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# OCR pulls in torch (~2 GB) - separate extra so CI and audio-only work skip it
ocr = ["easyocr==1.7.2"]
# VAD runs Silero's ONNX export (shipped in the package) on onnxruntime - no torch
audio = ["onnxruntime>=1.17"]
# Forced alignment rides on torchaudio + uroman (romanizes Indic text for the
# Latin MMS dictionary) - its own extra so OCR/VAD-only work skips the download
align = ["torchaudio>=2.1", "uroman>=1.2"]
# ASR cross-check calls the Sarvam HTTP API - only requests; the key comes from
# the SARVAM_API_KEY environment variable, never a dependency or a file
asr = ["requests>=2.31"]
# Optional cloud OCR: Sarvam Vision reads hard Devanagari bands more accurately
# than EasyOCR. Its own extra so the on-device EasyOCR path never needs the SDK;
# the key comes from SARVAM_API_KEY, never a dependency or a file
vision = ["sarvamai>=0.1"]

[project.scripts]
subtitle-checker = "subtitle_checker.cli:main"

[tool.setuptools.packages.find]
include = ["subtitle_checker*"]

[tool.setuptools.package-data]
"subtitle_checker.audio" = ["models/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
