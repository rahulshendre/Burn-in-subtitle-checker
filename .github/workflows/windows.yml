# Windows check and build, run by hand from the Actions tab (no Windows machine
# needed). The tests always run on Windows; the app is packaged only when
# "package" is ticked, and the zip is attached to the run as an artifact.
name: windows

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Also build the Windows app"
        type: boolean
        default: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev,audio,asr,vision]"
      - run: python -m pytest -q

  package:
    if: ${{ inputs.package }}
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Checker-windows
          path: dist/Subtitle-Checker-windows.zip
